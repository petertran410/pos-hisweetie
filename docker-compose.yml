version: "3.8"

services:
  pos-frontend-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sandbox-api.hisweetievietnam.com/api}
        NEXT_PUBLIC_TRACKASIA_API_KEY: ${NEXT_PUBLIC_TRACKASIA_API_KEY:-8e86ff1568b86c178062981349dee4bf35}
    image: pos-hisweetie-sandbox:latest
    container_name: pos-frontend-sandbox
    ports:
      - "3051:3050"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Next.js standalone chỉ nhận development/production — dùng APP_ENV để đánh dấu sandbox
      - NODE_ENV=production
      - APP_ENV=sandbox
      - PORT=3050
      - HOSTNAME=0.0.0.0
    mem_limit: 1g
    memswap_limit: 1g
    cpu_shares: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3050/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hisweetie-network

networks:
  hisweetie-network:
    external: true
